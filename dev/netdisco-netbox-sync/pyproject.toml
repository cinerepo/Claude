[project]
name = "netdisco-netbox-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "netboxlabs-diode-sdk",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mac-vendor-lookup>=0.1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
py-modules = ["sync", "config", "models", "netdisco_client", "transformer",
              "staging", "classifier", "discover", "lifecycle", "webapp"]

[project.scripts]
sync = "sync:main"
