[project]
name = "netdisco-netbox-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "netboxlabs-diode-sdk",
    "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = ["sync", "config", "models", "netdisco_client", "transformer"]

[project.scripts]
sync = "sync:main"
